name: fuzz
# Nightly time-boxed randomized fuzzing. This deliberately does NOT run on pull
# requests: `go test -fuzz` is wall-clock time-boxed and the Go fuzzing engine
# intermittently exits non-zero with "context deadline exceeded" when a worker does
# not wind down within -fuzztime even though no crasher was found, which made it a
# false-red PR gate. The deterministic seed-corpus run stays in ci.yml (blocking).
# The fuzz step is continue-on-error so the benign deadline flake never reds this
# workflow; any real crasher is printed in the summary and its input is uploaded as
# an artifact (add it under testdata/fuzz to turn it into a permanent ci.yml
# regression case).
#
# The targets are NOT listed here. fuzzrun finds every `func FuzzXxx(f *testing.F)`
# by parsing the test files, so a new target is fuzzed without anyone remembering to
# add a step. The hand-written list this replaces had drifted to 9 of 18 targets:
# MaxAbsMul's AVX2 kernel, among others, had never been fuzzed anywhere (the
# author's host is arm64).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: fuzz every target (found by parsing, not listed)
        run: go run github.com/go-fleettools/fuzzrun@v0.2.0 run --time 3m --jobs 2 --parallel 2 --logs fuzz-logs
        continue-on-error: true
      - name: upload any fuzz-discovered corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.arch }}
          path: testdata/fuzz/
          if-no-files-found: ignore
      - name: upload the per-target logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-logs-${{ matrix.arch }}
          path: fuzz-logs/
          if-no-files-found: ignore
